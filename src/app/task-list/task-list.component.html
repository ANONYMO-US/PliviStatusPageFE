
<h1> TASK MANAGEMENT APP</h1>


  <table class="container">
    <thead>
        <tr class="row">
          <th class="col-3">ID</th>
          <th class="col-3">Title</th>
        </tr>
    </thead>
    <tbody>
        <tr class="row" *ngFor="let task of listoftasks ">
            <th scope="row" class="col-3">{{ task.id }}</th>
            <td class="col-3">{{task?.description}}</td>
            <td class="col-3">
                <input type="text"
                placeholder="Type edited task here"
                name = "updatedtask" id = "updatedtask" minlength="1">
                <!-- <div *ngIf="updatedtask.errors?.['minlength']" class="alert-danger">Minlength</div> -->
                <button (click)="UpdateTask(task.id)">Edit</button>
            </td>
            <td class="col-3"><button (click)="DeleteTask(task.id)">Delete</button></td>
        </tr>
    </tbody>
  </table>

  <button (click)="navigatetonewtask()">New task Button</button>
